name: CI

on:
  pull_request:
    branches: [main]
  # push:
  #   branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome check (lint + format)
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit / integration tests (with coverage)
        run: npm run test:coverage

      - name: Upload Vitest coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-coverage
          path: coverage
          retention-days: 7
          if-no-files-found: warn

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply D1 local migrations
        run: npm run db:migrate:local

      # リポジトリの Secrets に CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_AI_TOKEN が
      # あれば .dev.vars に書き出し、E2E の要約生成を実 Workers AI で回す
      # （実態に近い検証を優先する方針）。無ければ決定的スタブで動く。
      - name: Enable real Workers AI summaries (when secrets are set)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          if [ -n "$CF_ACCOUNT_ID" ] && [ -n "$CF_AI_TOKEN" ]; then
            printf 'CLOUDFLARE_ACCOUNT_ID=%s\nCLOUDFLARE_AI_TOKEN=%s\n' "$CF_ACCOUNT_ID" "$CF_AI_TOKEN" > .dev.vars
            echo "Real Workers AI enabled for E2E"
          else
            echo "Cloudflare AI secrets not set — E2E uses the deterministic stub"
          fi

      - name: Run Playwright tests
        run: npm run test:e2e:evidence
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: warn
